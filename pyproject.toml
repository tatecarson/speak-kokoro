[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speak-kokoro"
version = "0.2.0"
description = "Local Kokoro text-to-speech for macOS, Windows, and Linux"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "kokoro==0.9.4",
  # 3.0.14 raises OverflowError while spaCy loads its tokenizer.
  "preshed==3.0.13",
  "soundfile>=0.13,<1",
  "sounddevice>=0.5,<1",
  "filelock>=3.16,<5",
  "rumps>=0.4,<1; sys_platform == 'darwin'",
  "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
japanese = ["misaki[ja]==0.9.4"]
chinese = ["misaki[zh]==0.9.4"]

[project.scripts]
speak-kokoro = "kokoro_cli:main"
kokoro-menubar = "kokoro_menubar:main"

[project.urls]
Repository = "https://github.com/tatecarson/speak-kokoro"
Issues = "https://github.com/tatecarson/speak-kokoro/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["kokoro_cli", "kokoro_runtime", "kokoro_daemon", "kokoro_menubar", "kokoro_player", "kokoro_entry", "kokoro_desktop"]
