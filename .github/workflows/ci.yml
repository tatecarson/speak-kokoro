name: Installation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build filelock numpy packaging
      - run: python -m build
      - run: python -m pip install --no-deps .
      - run: speak-kokoro --help
      - run: python -m unittest discover -s tests -v
      - name: Check Unix scripts
        if: runner.os != 'Windows'
        run: bash -n install.sh uninstall.sh bin/speak-kokoro
      - name: Check PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in @('install.ps1', 'uninstall.ps1')) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { throw $errors }
          }
  dependencies:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the user installer and check installed dependencies
        run: python tests/check_install.py
